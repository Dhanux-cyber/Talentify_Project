<div class="container d-flex justify-content-center align-items-center my-5">
    <div class="login-card">
        <div class="form-tabs">
            <div class="form-tab active">Login</div>
            <div class="form-tab inactive">Register</div>
        </div>

        <div class="form-card-body">
            <h3 class="form-card-title">Job Seeker Login</h3>
            
            <form id="loginForm">
                <div class="form-input-group">
                    <input type="email" placeholder="Email *" required id="email">
                </div>

                <div class="form-input-group">
                    <input type="password" placeholder="Password *" required id="password">
                    <i class="fa-solid fa-eye-slash toggle-password-icon" id="togglePassword"></i>
                </div>

                <div class="forgot-pwd-section">
                    <span class="forgot-pwd-text">Forgot Password ?</span>
                    <button type="button" class="form-reset-btn">Reset Now</button>
                </div>

                <button type="submit" class="form-submit-btn">Login</button>
            </form>

            <div class="register-redirect-text">
                Don't have an account? <a href="#">Register Now</a>
            </div>

            <div class="form-divider"></div>

            <div class="social-login-lbl">Or Login Using</div>
            <div class="social-icon-wrapper">
                <div class="social-btn google-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="red" d="M12.24 10.285V14.4h6.887c-.315 1.886-2.135 5.542-6.887 5.542-4.09 0-7.43-3.39-7.43-7.57s3.34-7.57 7.43-7.57c2.33 0 3.89.97 4.78 1.83l3.22-3.11C18.13 1.84 15.42 1 12.24 1 6.05 1 1 6.05 1 12.24s5.05 11.24 11.24 11.24c6.47 0 10.77-4.54 10.77-10.96 0-.74-.08-1.3-.18-1.79H12.24z"/></svg>
                </div>
                <div class="social-btn facebook-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="darkblue"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
