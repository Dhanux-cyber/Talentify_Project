<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


     <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css"> 
</head>
<body>
    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
    <header class="hero-section">
             <!-- Navigation Bar Start -->
<nav class="navbar">
            <div class="container">

        <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html">Job Listings</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul> 
</nav>
            
             
            </div>

    
            <!-- Navigation Bar End -->



    <div class="container d-flex justify-content-center align-items-center my-5">
        <div class="form-container-card" id="formWrapper">
            
            <div class="form-navigation-tabs">
                <div class="nav-tab active" id="loginTab" onclick="switchForm('login')">Login</div>
                <div class="nav-tab" id="registerTab" onclick="switchForm('register')">Register</div>
            </div>

            <div class="form-content-area">
                
                <div id="loginSection">
                    <h3 class="form-main-title">Job Seeker Login</h3>
                    <form id="loginForm">
                        <div class="input-block">
                            <input type="email" placeholder="Email *" required>
                        </div>
                        <div class="input-block">
                            <input type="password" placeholder="Password *" required id="loginPass">
                            <i class="fa-solid fa-eye-slash toggle-icon" onclick="togglePass('loginPass', this)"></i>
                        </div>
                        <div class="action-row">
                            <span class="small-label">Forgot Password ?</span>
                            <button type="button" class="btn-outline-blue">Reset Now</button>
                        </div><br>
                        <button type="submit" class="btn-solid-green">Login</button>
                    </form>
                    <div class="switch-text">
                        Don't have an account? <a href="javascript:void(0)" onclick="switchForm('register')">Register Now</a>
                    </div>
                </div>

                <div id="registerSection" style="display: none;">
                    <h3 class="form-main-title">Job Seeker Register</h3>
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input type="text" class="custom-input" placeholder="First Name *" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" class="custom-input" placeholder="Last Name *" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="email" class="custom-input" placeholder="Email *" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3 input-block">
                                <input type="password" class="custom-input" placeholder="Password *" id="regPass" required>
                                <i class="fa-solid fa-eye-slash toggle-icon" onclick="togglePass('regPass', this)"></i>
                            </div>
                            <div class="col-md-6 mb-3 input-block">
                                <input type="password" class="custom-input" placeholder="Confirm Password *" id="regConfirm" required>
                                <i class="fa-solid fa-eye-slash toggle-icon" onclick="togglePass('regConfirm', this)"></i>
                            </div>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-md-6 d-flex align-items-center">
                                <label class="me-3 small-label">Your Gender</label>
                                <div class="form-check me-3">
                                    <input class="form-check-input" type="radio" name="gender" id="male" checked>
                                    <label class="form-check-label upload-info" for="male">Male</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="female">
                                    <label class="form-check-label upload-info" for="female">Female</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="custom-input" placeholder="Home Town">
                            </div>
                        </div>

                        <div class="cv-upload-box mb-1">
                            <label for="cvFile" class="d-flex justify-content-between align-items-center w-100" style="cursor: pointer;">
                                <span class="small-label" style="color: slategray;">CV *</span>
                                <i class="fa-solid fa-upload"></i>
                            </label>
                            <input type="file" id="cvFile" style="display: none;">
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-7">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" required>
                                    <label class="form-check-label upload-info" for="terms">I agree to <strong>Privacy Policy & Terms/Conditions</strong>.</label>
                                </div>
                            </div>
                            
                            <div class="col-md-5">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="news">
                                    <label class="form-check-label upload-info" for="news">Receive jobs by email</label>
                                </div>
                            </div>
                        </div>

                        <div class="row align-items-center">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <button type="submit" class="btn-solid-green">REGISTER</button>
                            </div>
                            
                    </form>
                    <div class="switch-text mt-4">
                        Already have an account? <a href="javascript:void(0)" onclick="switchForm('login')">Login Now</a>
                    </div>
                </div>

                <div class="bottom-divider"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 


</body>
</html>
